[project]
name = "rosilda-mapas-de-calor"
version = "1.0.0"
description = "Heatmaps for Brazil regions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas",
    "matplotlib",
    "pandas",
    "requests",
    "pytest",
    "pytest-cov",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
    "ruff",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pyright]
typeCheckingMode = "basic"

[tool.coverage.run]
source = ["backend/src"]

[tool.coverage.report]
fail_under = 85
